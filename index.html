<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Station Builds · Honkai Star Rail</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>✦ Station <span>Builds</span> ✦</h1><p>Honkai: Star Rail · les builds de la bande, sans les trucs nuls d’internet comme azerty</p></header>
<main>
<button id="burger" aria-label="Menu">☰</button><div id="ov"></div><nav id="nav"></nav><div id="cur"></div>
<div class="row" style="margin-bottom:8px"><input id="q" placeholder="Rechercher un perso ou un mot…"><input id="pseudo" placeholder="Ton pseudo"></div>
<details class="card" id="formBox"><summary style="cursor:pointer;color:var(--gold)">＋ Ajouter</summary>
<div style="margin-top:10px"><div id="charBox"><div id="chips"></div><select id="f-char"></select><input id="f-char2" placeholder="Nom du personnage" style="display:none"><button class="btn" id="addc" type="button" style="display:none;margin-bottom:8px">+ Ajouter ce perso</button></div><div id="vidBox" style="display:none"><select id="f-mode"><option value="">— Mode de jeu —</option><option>Memory of Chaos</option><option>Pure Fiction</option><option>Apocalyptic Shadow</option><option>Anomaly Arbitration</option><option>Autre</option></select><input id="f-link" placeholder="Lien vidéo (YouTube, Twitch… en https://)"></div><div id="draftBox" style="display:none"><select id="f-dmode"><option value="std">Standard · 2 joueurs · 2 bans · 8 picks chacun</option><option value="stellar">Stellaire · 2 joueurs · 2 bans · 12 picks chacun</option><option value="trio">3 joueurs · 2 bans · 8 picks chacun</option></select><div class="row"><input id="f-p1" placeholder="Joueur 1"><input id="f-p2" placeholder="Joueur 2"><input id="f-p3" placeholder="Joueur 3" style="display:none"></div></div><input id="f-title" placeholder="Titre"><textarea id="f-text" placeholder=""></textarea>
<input id="f-img" type="file" accept="image/*,video/mp4,video/webm"><div class="mu" style="margin:-4px 0 8px">Image, ou vidéo mp4/webm de 20 Mo max (sinon colle un lien).</div><button class="btn p" id="send">Publier</button> <span class="mu" id="msg"></span></div></details>
<div id="list"><p class="mu">Chargement…</p></div>
<div id="tl" style="display:none"><div class="row" style="align-items:center;margin-bottom:8px"><select id="tl-sel" style="margin:0"></select><button class="btn" id="tl-new" style="flex:0;white-space:nowrap">＋ Nouvelle tier list</button><button class="btn" id="tl-del" style="flex:0;white-space:nowrap">🗑 Supprimer</button><button class="btn" id="tl-edit" style="flex:0;white-space:nowrap">✏️ Modifier les tiers</button><button class="btn" id="tl-addt" style="flex:0;white-space:nowrap;display:none">＋ Ajouter un tier</button></div><div id="tl-nbox" style="display:none" class="row"><input id="tl-name" placeholder="Nom de la tier list (ex. Meilleurs DPS)" style="margin:0"><button class="btn p" id="tl-create" style="flex:0">Créer</button></div><div class="mu" id="tl-msg" style="min-height:20px;margin:6px 0"></div><div id="tl-board"></div><input id="tl-q" placeholder="Rechercher dans les non classés…" style="margin-top:8px"></div>
<div id="roul" class="card" style="display:none;text-align:center"><div style="position:relative;display:inline-block;max-width:100%;padding-top:14px"><div style="position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2;font-size:30px;color:var(--gold);line-height:1">▼</div><canvas id="wheel" width="520" height="520" style="max-width:100%;height:auto;border-radius:50%"></canvas></div><div class="row" style="justify-content:center;align-items:center;margin-top:10px"><button class="btn p" id="spin" style="flex:0;white-space:nowrap">🎲 Lancer la roulette</button><label class="mu" style="flex:0;white-space:nowrap"><input type="checkbox" id="nodup" style="width:auto;margin:0 6px 0 0">Retirer le perso tiré</label><button class="btn" id="rreset" style="flex:0;white-space:nowrap">↺ Réinitialiser</button></div><div id="rname" class="mu" style="margin-top:10px;min-height:20px"></div><div style="margin-top:10px;text-align:left"><b style="color:var(--gold)">Historique</b> <span class="mu" id="rcount"></span><div id="rhist" class="mu">Aucun tirage pour l’instant.</div></div></div>
</main>
<div id="home"><div class="hwrap"><h1>✦ Station <span>Builds</span> ✦</h1><p class="mu">Choisis ton jeu</p><div id="games"></div><div id="hauth" style="margin-top:22px"></div></div></div>
<div id="pop" style="display:none;position:fixed;inset:0;z-index:80;background:#000b;align-items:center;justify-content:center;padding:20px"><div style="text-align:center;animation:popin .35s ease-out"><div style="width:min(300px,80vw);aspect-ratio:3/4;position:relative;border-radius:18px;overflow:hidden;border:3px solid var(--gold);background:linear-gradient(160deg,#3a2a70,#14102b);box-shadow:0 0 40px #e6b65599;margin:0 auto"><img id="pimg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center top"></div><h2 id="pname" style="color:var(--gold);margin:12px 0 8px"></h2><button class="btn p" id="pclose">OK</button></div></div>
<div id="room"><div class="rtop"><h2 id="rt" style="display:none"></h2><select id="rmode" style="max-width:300px;margin:0"><option value="std">Standard · 2 joueurs · 2 bans · 8 picks</option><option value="stellar">Stellaire · 2 joueurs · 2 bans · 12 picks</option><option value="trio">3 joueurs · 2 bans · 8 picks</option><option value="quad">4 joueurs · 2 bans · 8 picks</option></select><span id="rinfo" style="color:#c9c2ee;font-size:13px;flex:1"></span><button class="rbtn" id="rdice">🎲 Tirage au sort</button><button class="rbtn" id="rnew">↺ Nouveau draft</button><button class="rbtn" id="rclose" style="display:none">✕</button></div><div id="rrows"></div><div class="rtop"><input id="rsearch" placeholder="Rechercher un perso…" style="flex:1;min-width:120px;margin:0"><button class="rbtn" id="rundo">↶ Annuler</button></div><div class="grid" id="rgrid"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="supabase-shim.js"></script>
<script src="characters.js"></script>
<script src="images.js"></script>
<script src="app.js"></script>
</body>
</html>
